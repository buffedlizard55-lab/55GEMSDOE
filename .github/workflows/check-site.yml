name: Check research site

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  status-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tests/ is stdlib-only and guards the honesty of the published site;
      # tests_numeric/ needs the scientific stack and covers the maths.
      - name: Site guardrails (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Numeric tests
        run: python -m pytest tests_numeric -q
